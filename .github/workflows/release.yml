name: release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install GTK4
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libgirepository1.0-dev pkg-config

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: |
          go build -ldflags="-s -w" -o wallgtk .
          tar czf wallgtk-linux-amd64.tar.gz wallgtk

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: wallgtk-linux-amd64.tar.gz
