name: release

on:
  push:
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install GTK4
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev pkg-config

      - name: Build
        run: |
          go build -ldflags="-s -w" -o wallgtk .
          tar czf wallgtk-linux-amd64.tar.gz wallgtk

      - uses: softprops/action-gh-release@v2
        with:
          files: wallgtk-linux-amd64.tar.gz
